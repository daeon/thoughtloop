name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate skill pack
        run: python tests/validate_pack.py

      - name: Validate graph fixtures
        run: python tests/validate_graph.py

      - name: Calculate sample metrics
        run: python scripts/calculate_metrics.py examples/sample-loop-log.jsonl

      - name: Validate behavioral evaluation corpus
        run: python scripts/run_behavioral_evals.py --validate-only

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check whitespace
        run: git diff --check
